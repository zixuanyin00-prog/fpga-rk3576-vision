[Service]
WorkingDirectory=/root/free_rect_20261025/runtime
ExecStartPre=
ExecStartPre=/usr/bin/python3 /root/free_rect_20261025/runtime/flash_boot/wait_display_ready.py
ExecStartPre=/usr/bin/python3 /root/free_rect_20261025/runtime/display_policy/xorg_affinity.py
ExecStartPre=/usr/bin/xset s off
ExecStartPre=/usr/bin/xset s noblank
ExecStartPre=/usr/bin/xset -dpms
ExecStartPost=
ExecStart=
ExecStart=/usr/bin/python3 /root/free_rect_20261025/runtime/flash_boot/flash_boot.py --manifest /root/free_rect_20261025/runtime/flash_boot/release.json
UnsetEnvironment=
Environment=VISION_PREVIEW_CODEC=raw VISION_RKNN_C_API=1 VISION_MINIMAL60=1 VISION_INFERENCE_CAPACITY=4
Restart=no
