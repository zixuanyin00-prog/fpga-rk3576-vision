<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>FPGA 技术动画 · 样片</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b171f;color:#eef5f3;font-family:"Microsoft YaHei",sans-serif;display:grid;place-content:center;min-height:100vh}main{width:min(96vw,1600px)}canvas{width:100%;aspect-ratio:16/9;border-radius:12px;display:block}nav{display:flex;align-items:center;gap:18px;padding:18px 4px}button{border:1px solid #45626d;background:#18333e;color:#edf5f4;border-radius:8px;padding:9px 20px;cursor:pointer}input{flex:1;accent-color:#71dbce}span{font-variant-numeric:tabular-nums;color:#9ab3bd;min-width:95px}</style>
<main><canvas id="c" width="1920" height="1080"></canvas><nav><button id="play">播放</button><input id="seek" type="range" min="0" max="42" value="0" step="0.01"><span id="time">0.0 / 42 秒</span><button id="restart">重新开始</button></nav></main>
<script src="scene.js"></script><script>const c=document.querySelector('#c'),g=c.getContext('2d'),seek=document.querySelector('#seek'),play=document.querySelector('#play');let t=0,playing=false,last=performance.now();function frame(now){if(playing)t=Math.min(42,t+(now-last)/1000);last=now;if(t>=42){playing=false;play.textContent='播放'}TechFilm.draw(g,t);seek.value=t;document.querySelector('#time').textContent=t.toFixed(1)+' / 42 秒';requestAnimationFrame(frame)}play.onclick=()=>{if(t>=42)t=0;playing=!playing;play.textContent=playing?'暂停':'播放'};seek.oninput=()=>{t=+seek.value;playing=false;play.textContent='播放'};document.querySelector('#restart').onclick=()=>{t=0;playing=true;play.textContent='暂停'};requestAnimationFrame(frame);</script></html>
